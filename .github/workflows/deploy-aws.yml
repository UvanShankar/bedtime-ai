name: Deploy AWS Infrastructure (CDK Serverless)

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'infra-cdk/**'
      - 'generic-ai-service/**'
      - 'nila-core-service/**'
      - '.github/workflows/deploy-aws.yml'

jobs:
  deploy-aws:
    name: Build & Deploy Serverless Stacks to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: infra-cdk/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Install CDK Dependencies
        working-directory: ./infra-cdk
        run: npm ci

      - name: Build TypeScript
        working-directory: ./infra-cdk
        run: npm run build

      - name: CDK Bootstrap
        working-directory: ./infra-cdk
        run: npx cdk bootstrap

      - name: CDK Deploy All Stacks
        working-directory: ./infra-cdk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AI_SERVICE_API_KEY: ${{ secrets.AI_SERVICE_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx cdk deploy --all --require-approval never
